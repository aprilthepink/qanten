[workspace]
resolver = "3"
members = ["crates/qanten-sys", "crates/qanten", "crates/qanten-cli", "crates/qanten-graphics", "crates/qanten-serve", "crates/qanten-mock-driver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/aprilthepink/qanten"
authors = ["qanten contributors"]
keywords = ["qanten", "qant", "photonic", "npu", "neural-network"]
categories = ["hardware-support", "science", "api-bindings"]

[workspace.dependencies]
qanten-sys = { path = "crates/qanten-sys", version = "0.1.0" }
qanten = { path = "crates/qanten", version = "0.1.0", default-features = false }
half = "2.7"
libloading = "0.9"
thiserror = "2"
rayon = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ndarray = "0.17"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
glam = "0.34"
miniz_oxide = "0.8"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
png = "0.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
mem_forget = "deny"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
