version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
qanten = { workspace = true, features = ["driver", "safetensors"] }
qanten-serve = { path = "../../crates/qanten-serve" }
