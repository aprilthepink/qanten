[package]
name = "qanten-cli"
description = "Command-line tool for Q.ANT photonic NPUs: list devices, read sensors, benchmark and self-test"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "qanten"
path = "src/main.rs"

[dependencies]
qanten = { workspace = true, features = ["driver", "serde", "onnx", "numpy", "safetensors"] }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
qanten = { workspace = true, features = ["numpy"] }

[lints]
workspace = true
