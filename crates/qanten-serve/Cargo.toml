[package]
name = "qanten-serve"
description = "HTTP inference server for Q.ANT photonic NPUs: dynamic batching, multi-NPU, Prometheus metrics"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["qanten", "qant", "inference", "server", "npu"]
categories = ["web-programming::http-server", "science", "hardware-support"]

[[bin]]
name = "qanten-serve"
path = "src/main.rs"

[dependencies]
qanten = { workspace = true, features = ["driver", "onnx", "numpy", "safetensors"] }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
