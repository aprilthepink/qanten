[package]
name = "qanten-mock-driver"
description = "Test-only stand-in for libqant_native_computing_driver, backed by the qanten simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Same file name as Q.ANT's driver: libqant_native_computing_driver.so
name = "qant_native_computing_driver"
crate-type = ["cdylib"]

[dependencies]
qanten.workspace = true
qanten-sys.workspace = true
