name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - run: cargo test -p qanten --no-default-features
      - run: cargo bench --workspace --all-features --no-run
      - name: FFI path against the mock driver
        run: |
          cargo build -p qanten-mock-driver
          export QANTEN_DRIVER_LIB=$PWD/target/debug/libqant_native_computing_driver.so
          cargo test -p qanten --test driver_ffi
          cargo run -p qanten-cli -- doctor
          cargo run -p qanten-cli -- selftest
      - name: Examples
        run: |
          cargo run --release -p qanten --example quickstart
          cargo run --release -p qanten --example digit_recognition --features safetensors
          cargo run --release -p qanten-graphics --example ocean -- 128 ocean.png
          cargo run --release -p qanten-graphics --example crowd -- crowd.png
          cargo run --release -p qanten-graphics --example probes -- probes.png
          cargo run --release -p qanten-graphics --example blendshapes -- blendshapes.png
          cargo run --release -p qanten-graphics --example dct -- dct.png
          cargo run --release -p qanten-graphics --example terrain -- terrain.png
          cargo run --release -p qanten-graphics --example filters -- filters.png
          cargo run --release -p qanten-graphics --features gltf --example gltf -- crates/qanten-graphics/tests/data/gltf/tentacle.glb gltf.png
          cargo run --release -p qanten-graphics --example neural_fields -- neural_fields.png 20
      - name: Doc snippets compile and run
        run: python3 scripts/check_docs.py
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # qanten-bevy is its own workspace: Bevy takes several minutes and ~2 GB to
  # build, so it runs here instead of in the jobs above.
  bevy:
    name: qanten-bevy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/qanten-bevy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries for Bevy's windowed build
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/qanten-bevy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features gltf
      - run: cargo test --features gltf
      - run: cargo check --features windowed --example ocean

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-features
